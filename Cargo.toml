[package]
name = "nmp-settings"
version = "0.1.0"
authors = ["Your Name <you@example.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.0", features = ["router"] }
directories-next = "2.0.0"
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
tokio = "1.45.0"

[features]
default = ["desktop"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
appimage_assets = [] # adds prefix for appimage assets directory for correct file path

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
